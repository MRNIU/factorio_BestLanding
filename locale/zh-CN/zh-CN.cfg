[string-mod-setting-description]
BestLanding-resource-placement-mode-auto=起始蓝图里有资源驱动实体时使用蓝图驱动资源；否则使用固定 fallback 资源。
BestLanding-resource-placement-mode-fixed=始终使用固定 fallback 资源，不根据起始蓝图生成资源。
BestLanding-resource-placement-mode-blueprint=始终跳过固定 fallback 资源，并根据起始蓝图生成资源。
BestLanding-nauvis-base-level-basic=只应用基础基地蓝图。
BestLanding-nauvis-base-level-powered=累计应用基础基地和供电系统蓝图。
BestLanding-nauvis-base-level-production=累计应用基础基地、供电系统和生产设施蓝图。
BestLanding-vulcanus-base-level-basic=只应用基础基地蓝图。
BestLanding-vulcanus-base-level-powered=累计应用基础基地和供电系统蓝图。
BestLanding-vulcanus-base-level-production=累计应用基础基地、供电系统和生产设施蓝图。
BestLanding-gleba-base-level-basic=只应用基础基地蓝图。
BestLanding-gleba-base-level-powered=累计应用基础基地和供电系统蓝图。
BestLanding-gleba-base-level-production=累计应用基础基地、供电系统和生产设施蓝图。
BestLanding-fulgora-base-level-basic=只应用基础基地蓝图。
BestLanding-fulgora-base-level-powered=累计应用基础基地和供电系统蓝图。
BestLanding-fulgora-base-level-production=累计应用基础基地、供电系统和生产设施蓝图。
BestLanding-aquilo-base-level-basic=只应用基础基地蓝图。
BestLanding-aquilo-base-level-powered=累计应用基础基地和供电系统蓝图。
