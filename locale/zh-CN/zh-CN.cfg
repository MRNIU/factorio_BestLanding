[mod-name]
BestLanding=最佳着陆点

[mod-description]
BestLanding=清理降落区、按行星铺放发展资源，并应用预置起始蓝图。

[mod-setting-name]
BestLanding-apply-blueprints=应用起始蓝图
BestLanding-resource-placement-mode=资源生成模式
BestLanding-nauvis-base-level=Nauvis 基地等级
BestLanding-vulcanus-base-level=Vulcanus 基地等级
BestLanding-gleba-base-level=Gleba 基地等级
BestLanding-fulgora-base-level=Fulgora 基地等级
BestLanding-aquilo-base-level=Aquilo 基地等级

[mod-setting-description]
BestLanding-apply-blueprints=落地新行星时是否铺设预置的起始蓝图。关闭后只清地、铺资源，蓝图阶段跳过。注意：本设置只对落地后新出现的行星生效，已落地的行星不会回溯。
BestLanding-resource-placement-mode=控制起始资源使用固定 fallback 资源行，还是根据起始蓝图里的矿机、抽取泵和抽油机推断生成。只影响设置变更后新出现的行星。
BestLanding-nauvis-base-level=选择 Nauvis 累计应用到哪一级起始基地蓝图。只影响之后新处理的地表。
BestLanding-vulcanus-base-level=选择 Vulcanus 累计应用到哪一级起始基地蓝图。只影响之后新处理的地表。
BestLanding-gleba-base-level=选择 Gleba 累计应用到哪一级起始基地蓝图。只影响之后新处理的地表。
BestLanding-fulgora-base-level=选择 Fulgora 累计应用到哪一级起始基地蓝图。只影响之后新处理的地表。
BestLanding-aquilo-base-level=选择 Aquilo 累计应用到哪一级起始基地蓝图。只影响之后新处理的地表。

