[mod-name]
BestLanding=最佳着陆点

[mod-description]
BestLanding=清理降落区、按行星铺放发展资源，并应用预置起始蓝图。

[mod-setting-name]
BestLanding-apply-blueprints=应用起始蓝图
BestLanding-resource-placement-mode=资源生成模式

[mod-setting-description]
BestLanding-apply-blueprints=落地新行星时是否铺设预置的起始蓝图。关闭后只清地、铺资源，蓝图阶段跳过。注意：本设置只对落地后新出现的行星生效，已落地的行星不会回溯。
BestLanding-resource-placement-mode=控制起始资源使用固定 fallback 资源行，还是根据起始蓝图里的矿机、抽取泵和抽油机推断生成。只影响设置变更后新出现的行星。

[string-mod-setting]
BestLanding-resource-placement-mode-auto=自动
BestLanding-resource-placement-mode-fixed=固定位置
BestLanding-resource-placement-mode-blueprint=蓝图驱动

[string-mod-setting-description]
BestLanding-resource-placement-mode-auto=起始蓝图里有资源驱动实体时使用蓝图驱动资源；否则使用固定 fallback 资源。
BestLanding-resource-placement-mode-fixed=始终使用固定 fallback 资源，不根据起始蓝图生成资源。
BestLanding-resource-placement-mode-blueprint=始终跳过固定 fallback 资源，并根据起始蓝图生成资源。
