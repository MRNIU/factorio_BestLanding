[mod-name]
BestLanding=最佳着陆点

[mod-description]
BestLanding=清理降落区、按行星铺放发展资源，并生成一台满配传奇蜘蛛机甲。

[mod-setting-name]
BestLanding-apply-blueprints=应用起始蓝图

[mod-setting-description]
BestLanding-apply-blueprints=落地新行星时是否铺设预置的起始蓝图。关闭后只清地、铺资源、生成传奇蜘蛛，蓝图阶段跳过。注意：本设置只对落地后新出现的行星生效，已落地的行星不会回溯。
