[mod-setting-name]
BestLanding-apply-blueprints=Apply starter blueprints

[mod-setting-description]
BestLanding-apply-blueprints=When landing on a new planet, apply the bundled starter blueprint. Turn off to keep the cleared area and seeded resources but skip the blueprint pass (a legendary spidertron is still spawned). Only affects planets that appear after the change; already-landed planets are not reprocessed.
