BestLanding-fulgora-base-level=Fulgora base level
BestLanding-aquilo-base-level=Aquilo base level

[mod-setting-description]
BestLanding-apply-blueprints=When landing on a new planet, apply the bundled starter blueprint. Turn off to keep the cleared area and seeded resources but skip the blueprint pass. Only affects planets that appear after the change; already-landed planets are not reprocessed.
BestLanding-resource-placement-mode=Controls whether starter resources use the fixed fallback row or are inferred from starter-blueprint mining drills, offshore pumps, and pumpjacks. Only affects planets that appear after the change.
BestLanding-nauvis-base-level=Selects which cumulative starter-base blueprint levels are applied on Nauvis. Only affects newly processed surfaces.
BestLanding-vulcanus-base-level=Selects which cumulative starter-base blueprint levels are applied on Vulcanus. Only affects newly processed surfaces.
BestLanding-gleba-base-level=Selects which cumulative starter-base blueprint levels are applied on Gleba. Only affects newly processed surfaces.
BestLanding-fulgora-base-level=Selects which cumulative starter-base blueprint levels are applied on Fulgora. Only affects newly processed surfaces.
BestLanding-aquilo-base-level=Selects which cumulative starter-base blueprint levels are applied on Aquilo. Only affects newly processed surfaces.

