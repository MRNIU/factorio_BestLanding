[mod-setting-name]
BestLanding-apply-blueprints=Apply starter blueprints
BestLanding-resource-placement-mode=Resource placement mode

[mod-setting-description]
BestLanding-apply-blueprints=When landing on a new planet, apply the bundled starter blueprint. Turn off to keep the cleared area and seeded resources but skip the blueprint pass. Only affects planets that appear after the change; already-landed planets are not reprocessed.
BestLanding-resource-placement-mode=Controls whether starter resources use the fixed fallback row or are inferred from starter-blueprint mining drills, offshore pumps, and pumpjacks. Only affects planets that appear after the change.

[string-mod-setting]
BestLanding-resource-placement-mode-auto=Auto
BestLanding-resource-placement-mode-fixed=Fixed
BestLanding-resource-placement-mode-blueprint=Blueprint-driven

[string-mod-setting-description]
BestLanding-resource-placement-mode-auto=Use blueprint-driven resources when the starter blueprint contains resource driver entities; otherwise use fixed fallback resources.
BestLanding-resource-placement-mode-fixed=Always use fixed fallback resources and never seed resources from the starter blueprint.
BestLanding-resource-placement-mode-blueprint=Always skip fixed fallback resources and seed resources from the starter blueprint.
