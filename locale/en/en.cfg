BestLanding-resource-placement-mode-auto=Use blueprint-driven resources when the starter blueprint contains resource driver entities; otherwise use fixed fallback resources.
BestLanding-resource-placement-mode-fixed=Always use fixed fallback resources and never seed resources from the starter blueprint.
BestLanding-resource-placement-mode-blueprint=Always skip fixed fallback resources and seed resources from the starter blueprint.
BestLanding-nauvis-base-level-basic=Apply only the basic-base blueprint.
BestLanding-nauvis-base-level-powered=Apply the basic-base and power-system blueprints.
